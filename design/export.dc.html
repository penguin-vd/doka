<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0C0D}
a{color:#E8B04B}a:hover{color:#F5C977}
input[type=range],input[type=checkbox]{accent-color:#E8B04B}
input[type=checkbox]{width:18px;height:18px;margin:0}
button,input,select{font:inherit}
</style>
</helmet>
<div style="min-height: 900px; display: flex; align-items: center; justify-content: center; padding: 40px 16px; box-sizing: border-box; background: #0C0C0D; color: #ECECEE; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px;">
  <div role="dialog" aria-labelledby="export-title" style="width: 100%; max-width: 560px; background: #1F1F22; border: 1px solid #34343A; border-radius: 12px; display: flex; flex-direction: column;">

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid #2E2E32;">
      <h1 id="export-title" style="margin: 0; font-size: 18px; font-weight: 600;">Export photo</h1>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #B4B4BA; border-radius: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 22px; padding: 20px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="exp-name" style="color: #C8C8CE;">File name</label>
        <input id="exp-name" type="text" value="photo-edited" readOnly="{{yes}}" style="height: 44px; padding: 0 12px; background: #151517; color: #ECECEE; border: 1px solid #3A3A40; border-radius: 8px; font-family: 'IBM Plex Mono', monospace;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span id="fmt-label" style="color: #C8C8CE;">Format</span>
        <div role="group" aria-labelledby="fmt-label" style="display: flex; gap: 4px; padding: 4px; background: #151517; border-radius: 8px;">
          <sc-for list="{{formats}}" as="f" hint-placeholder-count="3">
            <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
          </sc-for>
        </div>
      </div>

      <sc-if value="{{showQuality}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; justify-content: space-between;">
            <label for="exp-q" style="color: #C8C8CE;">Quality</label>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #E8B04B;">{{quality}}</span>
          </div>
          <input id="exp-q" type="range" min="50" max="100" value="{{quality}}" onChange="{{setQuality}}" style="width: 100%; margin: 0;">
        </div>
      </sc-if>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="exp-size" style="color: #C8C8CE;">Size</label>
        <select id="exp-size" style="height: 44px; padding: 0 10px; background: #151517; color: #ECECEE; border: 1px solid #3A3A40; border-radius: 8px;">
          <option>Original size</option>
          <option>Long edge 3000 px</option>
          <option>Long edge 2048 px</option>
          <option>Long edge 1080 px</option>
        </select>
      </div>

      <fieldset style="margin: 0; padding: 14px; border: 1px solid #34343A; border-radius: 10px; display: flex; flex-direction: column; gap: 12px;">
        <legend style="padding: 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9A9AA1;">Metadata</legend>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; cursor: pointer;">
          <input type="checkbox" checked="{{keepMeta}}" onChange="{{toggleMeta}}">
          <span style="font-weight: 500;">Keep metadata</span>
        </label>
        <sc-if value="{{keepMeta}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 10px; padding-left: 28px;">
            <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; color: #B4B4BA; font-size: 13px;">
              <li style="display: flex; align-items: center; gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A6D99B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Camera &amp; lens</li>
              <li style="display: flex; align-items: center; gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A6D99B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Exposure settings</li>
              <li style="display: flex; align-items: center; gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A6D99B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Date taken</li>
              <li style="display: flex; align-items: center; gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A6D99B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Color profile</li>
            </ul>
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; cursor: pointer;">
              <input type="checkbox" checked="{{keepGps}}" onChange="{{toggleGps}}">
              <span>Include GPS location</span>
            </label>
            <p style="margin: 0; font-size: 12px; color: #8E8E95;">Untick to strip the location before sharing online.</p>
          </div>
        </sc-if>
        <sc-if value="{{noMeta}}" hint-placeholder-val="{{false}}">
          <p style="margin: 0; padding-left: 28px; font-size: 13px; color: #F0B37A;">Camera, lens and date will be removed from the exported file.</p>
        </sc-if>
      </fieldset>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-top: 1px solid #2E2E32;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8E8E95;">{{summary}}</span>
      <div style="display: flex; gap: 8px;">
        <a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 16px; color: #D8D8DD; border: 1px solid #3A3A40; border-radius: 8px; text-decoration: none;">Cancel</a>
        <a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 20px; background: #E8B04B; color: #1A1408; border-radius: 8px; font-weight: 600; text-decoration: none;">Export</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { format: 'JPEG', quality: 90, keepMeta: true, keepGps: true };
  renderVals() {
    var self = this;
    var st = this.state;
    var formats = ['JPEG', 'PNG', 'TIFF'].map(function (f) {
      var on = st.format === f;
      return {
        label: f,
        pressed: on ? 'true' : 'false',
        style: 'flex: 1; height: 40px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 500; background: ' + (on ? '#34343A' : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#A1A1A8') + ';',
        pick: function () { self.setState({ format: f }); }
      };
    });
    var ext = st.format === 'JPEG' ? 'jpg' : st.format === 'PNG' ? 'png' : 'tif';
    return {
      yes: true,
      formats: formats,
      showQuality: st.format === 'JPEG',
      quality: st.quality,
      setQuality: function (e) { self.setState({ quality: Number(e.target.value) }); },
      keepMeta: st.keepMeta,
      noMeta: !st.keepMeta,
      keepGps: st.keepGps,
      toggleMeta: function () { self.setState({ keepMeta: !self.state.keepMeta }); },
      toggleGps: function () { self.setState({ keepGps: !self.state.keepGps }); },
      summary: 'photo-edited.' + ext + (st.keepMeta ? ' · metadata kept' : ' · no metadata')
    };
  }
}
</script>
</body>
</html>
