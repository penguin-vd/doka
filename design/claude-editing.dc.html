<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Code editing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#161618}
a{color:#E8B04B}a:hover{color:#F5C977}
button{font:inherit}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #161618; color: #ECECEE; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px;">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 16px; min-height: 44px; border-bottom: 1px solid #2E2E32; background: #1C1C1F;">
    <div style="display: flex; align-items: center; gap: 10px; flex-grow: 1; min-width: 220px;">
      <span style="font-weight: 600; letter-spacing: 0.02em;">[App name]</span>
      <span style="color: #5A5A60;" aria-hidden="true">/</span>
      <span style="color: #B4B4BA;">[Folder name]</span>
      <span style="color: #5A5A60;" aria-hidden="true">/</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px;">photo-04.jpg</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #2A2418; color: #F5C977; font-size: 13px;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #E8B04B;" aria-hidden="true"></span>
      Claude Code connected
    </div>
  </header>

  <div style="display: flex; flex-wrap: wrap; flex-grow: 1; align-items: stretch;">

    <nav aria-label="Photos in folder" style="flex: 1 1 220px; max-width: 100%; padding: 14px 12px; background: #1A1A1D; border-right: 1px solid #2E2E32; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 13px; color: #D8D8DD;">[Folder name]</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="8">
          <div style="{{t.style}}">
            <sc-if value="{{t.busy}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; inset: auto 4px 4px auto; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.75); color: #F5C977; font-size: 10px; font-weight: 500;">Claude</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 24px 32px; background: #111113; box-sizing: border-box;">
      <div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 14px; background: #2A2418; border: 1px solid #5A4A25; border-radius: 10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5C977" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg>
        <span style="flex-grow: 1; color: #F3E3C0;">Claude changed this photo: Exposure +15, Shadows +30, Warm filter 60%</span>
        <button type="button" style="height: 40px; padding: 0 14px; background: transparent; color: #F3E3C0; border: 1px solid #6A5830; border-radius: 8px; cursor: pointer;">Undo</button>
        <button type="button" style="height: 40px; padding: 0 16px; background: #E8B04B; color: #1A1408; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer;">Keep</button>
      </div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 420px;">
        <figure style="margin: 0; width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <svg viewBox="0 0 120 80" role="img" aria-label="Placeholder photo, before" style="display: block; width: 100%; height: auto; border-radius: 2px; filter: brightness(0.82) saturate(0.85);">
              <rect width="120" height="80" fill="#24324F"></rect><rect width="120" height="26" fill="#1E2A44"></rect><rect y="26" width="120" height="30" fill="#34406A"></rect><circle cx="83" cy="36" r="7" fill="#E8E3C0"></circle>
              <polygon points="0,52 18,30 32,44 47,25 64,47 78,33 96,48 110,36 120,43 120,56 0,56" fill="#141B2C"></polygon><polygon points="0,56 14,43 30,52 52,40 70,54 90,44 120,54 120,60 0,60" fill="#0C111C"></polygon>
            </svg>
            <span style="font-size: 12px; color: #8E8E95;">Before</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <svg viewBox="0 0 120 80" role="img" aria-label="Placeholder photo, after Claude's edit" style="display: block; width: 100%; height: auto; border-radius: 2px; filter: brightness(1.12) contrast(1.05) saturate(1.1) sepia(0.18);">
              <rect width="120" height="80" fill="#24324F"></rect><rect width="120" height="26" fill="#1E2A44"></rect><rect y="26" width="120" height="30" fill="#34406A"></rect><circle cx="83" cy="36" r="7" fill="#E8E3C0"></circle>
              <polygon points="0,52 18,30 32,44 47,25 64,47 78,33 96,48 110,36 120,43 120,56 0,56" fill="#141B2C"></polygon><polygon points="0,56 14,43 30,52 52,40 70,54 90,44 120,54 120,60 0,60" fill="#0C111C"></polygon>
            </svg>
            <span style="font-size: 12px; color: #F5C977;">After</span>
          </div>
        </figure>
      </div>
    </main>

    <aside style="flex: 1 1 340px; max-width: 100%; display: flex; flex-direction: column; background: #1C1C1F; border-left: 1px solid #2E2E32;">
      <div style="padding: 14px 18px; border-bottom: 1px solid #2E2E32;">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600;">Claude Code activity</h2>
        <p style="margin: 4px 0 0; font-size: 12px; color: #9A9AA1;">Tool calls from the MCP server, newest last</p>
      </div>
      <ol style="list-style: none; margin: 0; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">
        <sc-for list="{{calls}}" as="c" hint-placeholder-count="5">
          <li style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: #151517; border: 1px solid #2E2E32; border-radius: 8px;">
            <div style="display: flex; justify-content: space-between; gap: 8px;">
              <code style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #F5C977;">{{c.tool}}</code>
              <span style="font-size: 12px; color: #8E8E95;">{{c.kind}}</span>
            </div>
            <span style="font-size: 13px; color: #C8C8CE;">{{c.text}}</span>
          </li>
        </sc-for>
      </ol>
      <div style="margin: 0 12px 12px; padding: 12px; background: #141416; border: 1px solid #2E2E32; border-radius: 8px;">
        <h3 style="margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9A9AA1;">Applied recipe</h3>
        <pre style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #C8C8CE; white-space: pre;">{{recipe}}</pre>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var colors = ['#9DB9D6', '#B9C9B0', '#E8C9A0', '#34406A', '#CFDDEA', '#8FC3DD', '#C89BB0', '#A9AEB3'];
    var thumbs = colors.map(function (c, i) {
      var on = i === 3;
      return {
        busy: on,
        style: 'position: relative; aspect-ratio: 3 / 2; border-radius: 4px; background: ' + c + '; border: 2px solid ' + (on ? '#E8B04B' : 'transparent') + ';'
      };
    });
    var calls = [
      { tool: 'list_photos', kind: 'read', text: 'Found 8 photos in [Folder name]' },
      { tool: 'get_photo_info', kind: 'read', text: 'photo-04.jpg · metadata, histogram: mostly dark' },
      { tool: 'render_preview', kind: 'read', text: 'Looked at a small preview of photo-04.jpg' },
      { tool: 'apply_edits', kind: 'edit', text: 'Saved a new recipe for photo-04.jpg (original untouched)' },
      { tool: 'render_preview', kind: 'read', text: 'Checked the result' }
    ];
    var recipe = JSON.stringify({ file: 'photo-04.jpg', edits: { exposure: 15, shadows: 30 }, filter: { name: 'warm', strength: 60 } }, null, 2);
    return { thumbs: thumbs, calls: calls, recipe: recipe };
  }
}
</script>
</body>
</html>
